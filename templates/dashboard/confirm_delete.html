{% extends "base.html" %}
{% block title %}Confirm | Staff Dashboard{% endblock %}
{% block content %}
<div class="form-card">
<h1>Confirm action</h1>
<p>Are you sure you want to continue with <strong>{{ object }}</strong>?</p>
<form method="post">{% csrf_token %}<button class="button danger" type="submit">Confirm</button>
<a class="button secondary" href="{% url cancel_url %}">Cancel</a></form>
</div>
{% endblock %}
