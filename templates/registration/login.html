{% extends "base.html" %}
{% block title %}Log in | Piki Ora{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Log in</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register</a>.</p>
</div>
{% endblock %}
